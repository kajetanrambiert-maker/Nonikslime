<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nonikslime | Minecraft Skin</title>
  <style>
    :root {
      --bg1: #196ec9;
      --bg2: #000911;
      --bg3: #1d5b92;
      --panel: rgba(20, 40, 60, 0.82);
      --line: rgba(255,255,255,0.2);
      --text: #edf7ff;
      --muted: #cfeaff;
      --primary: #7bd1ff;
      --primary-2: #39d0ff;
      --gold: #ffd76a;
      --dark: #071521;
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
      background:
        linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.45)),
        radial-gradient(circle at top, rgba(88, 174, 255, 0.35), transparent 35%),
        linear-gradient(180deg, var(--bg1) 0%, var(--bg2) 40%, var(--bg3) 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 28px;
    }

    .container {
      width: min(1100px, 100%);
      background: rgba(7, 21, 33, 0.6);
      border: 2px solid var(--line);
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 30px 80px rgba(0,0,0,0.45);
      backdrop-filter: blur(4px);
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 28px;
      border-bottom: 2px solid var(--line);
      background: rgba(255,255,255,0.03);
    }

    .logo {
      font-weight: 800;
      letter-spacing: 2px;
      font-size: 1.1rem;
      color: var(--gold);
      text-transform: uppercase;
    }

    .nav {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
    }

    .nav a {
      text-decoration: none;
      color: var(--muted);
      font-weight: 700;
      font-size: 0.9rem;
      padding: 8px 12px;
      border-radius: 999px;
      transition: 0.2s ease;
    }

    .nav a:hover {
      background: rgba(255,255,255,0.08);
      color: white;
    }

    a:focus-visible {
      outline: 3px solid var(--gold);
      outline-offset: 4px;
    }

    .hero {
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 32px;
      padding: 42px 28px 30px;
      align-items: center;
    }

    .badge {
      display: inline-block;
      background: rgba(123, 209, 255, 0.12);
      border: 1px solid rgba(123, 209, 255, 0.35);
      color: var(--primary);
      font-size: 0.82rem;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 8px 14px;
      border-radius: 999px;
      margin-bottom: 16px;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.4rem, 5vw, 5rem);
      line-height: 0.96;
      letter-spacing: -2px;
    }

    .accent {
      color: var(--primary);
      text-shadow: 0 0 20px rgba(123,209,255,0.5);
    }

    .subtitle {
      margin-top: 18px;
      font-size: 1.08rem;
      line-height: 1.7;
      color: var(--muted);
      max-width: 650px;
    }

    .actions {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      margin-top: 26px;
    }

    .btn {
      display: inline-block;
      text-decoration: none;
      font-weight: 800;
      padding: 14px 22px;
      border-radius: 14px;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      border: 2px solid transparent;
    }

    .btn:hover {
      transform: translateY(-2px);
    }

    .btn-primary {
      background: linear-gradient(180deg, var(--primary), var(--primary-2));
      color: var(--dark);
      box-shadow: 0 10px 20px rgba(57,208,255,0.35);
    }

    .btn-secondary {
      background: rgba(255,255,255,0.04);
      color: white;
      border-color: rgba(255,255,255,0.18);
    }

    .skin-box {
      background: rgba(255,255,255,0.04);
      border: 2px solid var(--line);
      border-radius: 24px;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: inset 0 0 20px rgba(255,255,255,0.04);
    }

    .skin-frame {
      width: min(100%, 420px);
      aspect-ratio: 1 / 1;
      background: linear-gradient(180deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02));
      border-radius: 22px;
      border: 3px solid rgba(255,255,255,0.18);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
    }

    .skin-image {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
      filter: drop-shadow(0 18px 20px rgba(0,0,0,0.25));
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(2, minmax(120px, 1fr));
      gap: 16px;
      padding: 0 28px 28px;
    }

    .stats-heading {
      grid-column: 1 / -1;
      margin: 0 0 4px;
      text-align: center;
      font-size: clamp(1.4rem, 3vw, 2rem);
    }

    .stat {
      display: block;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 18px 16px;
      text-align: center;
    }

    .stat-link {
      color: inherit;
      text-decoration: none;
      transition: border-color 0.2s ease, background 0.2s ease;
    }

    .stat-link:hover {
      border-color: var(--primary);
      background: rgba(123, 209, 255, 0.08);
    }

    .stat-number {
      display: block;
      font-size: 1.8rem;
      font-weight: 900;
      color: var(--gold);
      margin-bottom: 6px;
    }

    .stat-label {
      color: var(--muted);
      font-size: 0.85rem;
      letter-spacing: 0.8px;
      text-transform: uppercase;
    }

    @media (max-width: 820px) {
      .hero {
        grid-template-columns: 1fr;
        text-align: center;
      }

      .actions {
        justify-content: center;
      }

      .topbar {
        flex-direction: column;
        gap: 12px;
      }
    }

    @media (max-width: 560px) {
      body { padding: 14px; }
      .topbar, .hero, .stats { padding-left: 18px; padding-right: 18px; }
      .stats { grid-template-columns: 1fr; }
      .nav { justify-content: center; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="topbar">
      <div class="logo">Nonikslime</div>
      <nav class="nav">
        <a href="#home">Home</a>
        <a href="#skin">Skin</a>
        <a href="#about">O mnie</a>
      </nav>
    </div>

    <section class="hero" id="home">
      <div>
        <div class="badge">Minecraft Profile</div>
        <h1>Siema, jestem <span class="accent">Nonikslime</span></h1>
        <p class="subtitle">
          Gram i tworzę w świecie Minecraft. Zobacz mój skin i znajdź mnie na YouTube oraz TikToku.
        </p>

        <div class="actions">
          <a class="btn btn-primary" href="skin.png" target="_blank" rel="noopener noreferrer">Zobacz skin</a>
          <a class="btn btn-secondary" href="#about">Poznaj mnie</a>
        </div>
      </div>

      <div class="skin-box" id="skin">
        <div class="skin-frame">
          <img class="skin-image" src="skin.png" alt="Skin Minecraft: czarna postać z turkusową twarzą">
        </div>
      </div>
    </section>

    <section class="stats" id="about" aria-labelledby="socials-heading">
      <h2 class="stats-heading" id="socials-heading">Znajdź mnie w sieci</h2>
      <a class="stat stat-link" href="https://www.youtube.com/@Nonikslime" target="_blank" rel="noopener noreferrer">
        <span class="stat-number">YouTube</span>
        <span class="stat-label">@Nonikslime</span>
      </a>
      <a class="stat stat-link" href="https://www.tiktok.com/@Nonikslime" target="_blank" rel="noopener noreferrer">
        <span class="stat-number">TikTok</span>
        <span class="stat-label">@Nonikslime</span>
      </a>
    </section>
  </div>
</body>
</html>
</await page.getByRole('button', { name: 'Commit changes...' }).click({ force: true }); return (await page.locator('body').innerText()).slice(-1500);
